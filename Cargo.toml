[package]
name = "wave9000"
version = "0.0.1"
edition = "2024"
description = "A bare, modular audio workstation: record and arrange sound on tracks, mix and export, with a layout you rearrange like foobar2000."
license = "MIT"

[dependencies]
# The interface (egui), the window and input (winit, egui-winit), and the
# pixels: drawn by the CPU (src/shell, from Folio), so no graphics driver is
# loaded. Audio files are decoded and encoded by the system's ffmpeg, run as
# a separate program, so no codecs are linked in; the mixer is our own.
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-winit = { version = "0.37.0", default-features = false, features = [
    "accesskit", "clipboard", "links", "wayland", "x11",
] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
accesskit_winit = "0.34.1"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
# The app icon, decoded once at start.
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Installing adapters from their zips.
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Sound in and out.
cpal = { version = "0.18.2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS: the system menu bar, and the window's shared buffers drawn by the CPU.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSValue", "NSData"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CATransaction", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }

# Windows and Linux: softbuffer hands the drawn pixels to the window, and
# removed adapters go to the system's trash.
[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = "5.2.9"
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
